version: "3.9"

services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    container_name: vijaya_app
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    networks: [vijaya_net]

  postgres:
    image: postgres:16-alpine
    container_name: vijaya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-vijaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vijaya_dev_password}
      POSTGRES_DB:       ${DB_NAME:-vijaya_db}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vijaya}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vijaya_net]

  redis:
    image: redis:7-alpine
    container_name: vijaya_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vijaya_net]

  minio:
    image: minio/minio:latest
    container_name: vijaya_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-vijaya_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vijaya_minio_password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [vijaya_net]

  minio-setup:
    image: minio/mc:latest
    container_name: vijaya_minio_setup
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-vijaya_admin} ${MINIO_ROOT_PASSWORD:-vijaya_minio_password};
      mc mb local/vijaya-uploads --ignore-existing;
      mc anonymous set download local/vijaya-uploads;
      exit 0;"
    networks: [vijaya_net]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vijaya_net:
    driver: bridge
